name: coverage-lint

"on":
  push:
    branches: [main, master, v0.2.0, v0.2.1]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  NOT_CRAN: "true"
  _R_CHECK_FORCE_SUGGESTS_: "false"

permissions:
  contents: read

jobs:
  coverage:
    name: coverage / ubuntu-latest
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: '"hard"'
          extra-packages: |
            any::covr
            any::testthat
            any::pkgload
            any::withr

      - name: Run coverage evidence
        run: |
          Rscript tools/ci-coverage.R

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-evidence
          path: |
            coverage-summary.txt
            coverage.rds

  lint:
    name: lint / ubuntu-latest
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: '"hard"'
          extra-packages: |
            any::lintr

      - name: Install package for lint analysis
        run: |
          R CMD INSTALL .

      - name: Run correctness lint
        run: |
          Rscript tools/ci-lint.R

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lint-evidence
          path: |
            lint-results.txt
            lint-results.rds
