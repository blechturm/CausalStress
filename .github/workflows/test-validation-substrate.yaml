name: test-validation-substrate

"on":
  push:
    branches: [main, master, v0.2.0]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  NOT_CRAN: "true"
  _R_CHECK_FORCE_SUGGESTS_: "false"

permissions:
  contents: read

jobs:
  test-validation-substrate:
    name: ${{ matrix.config.os }} / R ${{ matrix.config.r }}
    runs-on: ${{ matrix.config.os }}

    strategy:
      fail-fast: false
      matrix:
        config:
          - { os: ubuntu-latest, r: release }
          - { os: windows-latest, r: release }
          - { os: macos-latest, r: release }

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          use-public-rspm: true

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: '"hard"'
          extra-packages: |
            any::testthat
            any::pkgload
            any::withr

      - name: Install package for worker processes
        run: |
          R CMD INSTALL .

      - name: Run full test suite
        run: |
          Rscript -e "testthat::test_local('.', reporter = 'summary', stop_on_failure = TRUE)"

      - name: Run validation suite
        run: |
          Rscript tools/ci-validation.R

      - name: Record reproducibility substrate
        run: |
          Rscript tools/ci-substrate.R

      - uses: actions/upload-artifact@v4
        with:
          name: substrate-${{ matrix.config.os }}-${{ matrix.config.r }}
          path: ci-substrate.txt
