name: pkgdown-site

"on":
  push:
    branches: [main, master, v0.2.1]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      deploy_pages:
        description: Deploy this exact release tag to GitHub Pages after tag CI is green
        required: true
        default: false
        type: boolean

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  NOT_CRAN: "true"
  _R_CHECK_FORCE_SUGGESTS_: "false"

permissions:
  contents: read

jobs:
  build-site:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true

      - name: Validate an explicit Pages deployment request
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.deploy_pages }}
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" != "tag" || ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Pages deployment requires a semantic release tag ref (vX.Y.Z)." >&2
            exit 1
          fi
          package_version="$(sed -n 's/^Version:[[:space:]]*//p' DESCRIPTION)"
          if [[ "$GITHUB_REF_NAME" != "v$package_version" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match DESCRIPTION version $package_version." >&2
            exit 1
          fi

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: '"hard"'
          install-quarto: true
          quarto-version: 1.9.38
          extra-packages: |
            any::pkgload
            any::knitr
            any::rmarkdown
            quarto@1.5.1
            pkgdown@2.2.1
          needs: website

      - name: Verify Quarto-only source policy and toolchain pins
        run: Rscript tools/ci-docs.R

      - name: Validate registry-keyed dossier sources
        run: Rscript dev/render_dossiers.R --validate-only

      - name: Install the source revision used by executable documentation
        run: |
          mkdir -p "$RUNNER_TEMP/causalstress-doc-lib"
          R CMD INSTALL --library="$RUNNER_TEMP/causalstress-doc-lib" .
          echo "CAUSALSTRESS_DOC_LIB=$RUNNER_TEMP/causalstress-doc-lib" >> "$GITHUB_ENV"
          echo "R_LIBS_USER=$RUNNER_TEMP/causalstress-doc-lib:$R_LIBS_USER" >> "$GITHUB_ENV"

      - name: Render and verify README
        run: |
          quarto render README.qmd --to gfm
          git diff --exit-code -- README.md

      - name: Build non-publishing pkgdown preview
        run: Rscript -e "Sys.setenv(RSTUDIO_PANDOC = file.path(dirname(quarto::quarto_path()), 'tools')); pkgdown::build_site(new_process = FALSE, install = FALSE)"

      - name: Render all DGP reports into the preview
        run: Rscript dev/render_dossiers.R --installed --output-dir=docs/dgp

      - name: Verify assembled site links, indexes, and installed package
        run: Rscript tools/ci-site.R

      - name: Verify source worktree stayed clean
        run: |
          git diff --exit-code
          test -z "$(git ls-files --others --exclude-standard)"

      - uses: actions/upload-artifact@v4
        with:
          name: pkgdown-preview-${{ github.sha }}
          path: docs

      - name: Package the reviewed site for GitHub Pages
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.deploy_pages }}
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs

  runtime-without-documentation-tooling:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: '"hard"'
          install-pandoc: false
          install-quarto: false

      - name: Install and load without Quarto or pkgdown
        run: |
          R CMD INSTALL .
          Rscript -e "stopifnot(!requireNamespace('quarto', quietly = TRUE), !requireNamespace('pkgdown', quietly = TRUE)); library(CausalStress); cs_run_single('synth_baseline', 'lm_att', n = 50, seed = 1)"

  deploy-pages:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.deploy_pages && github.ref_type == 'tag' }}
    needs: [build-site, runtime-without-documentation-tooling]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Deploy the reviewed release site
        id: deployment
        uses: actions/deploy-pages@v4
