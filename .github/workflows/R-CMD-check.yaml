name: R-CMD-check

"on":
  push:
    branches: [main, master, v0.2.0]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  NOT_CRAN: "true"
  _R_CHECK_FORCE_SUGGESTS_: "false"

permissions:
  contents: read

jobs:
  R-CMD-check:
    name: ${{ matrix.config.os }} / R ${{ matrix.config.r }}
    runs-on: ${{ matrix.config.os }}

    strategy:
      fail-fast: false
      matrix:
        config:
          - { os: ubuntu-latest, r: release }
          - { os: ubuntu-latest, r: devel }
          - { os: windows-latest, r: release }
          - { os: macos-latest, r: release }

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          use-public-rspm: true

      - name: Install archived qs dependency
        run: |
          Rscript tools/ci-install-archived-qs.R

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: '"hard"'
          extra-packages: |
            any::rcmdcheck
            any::testthat
            any::pkgload
            any::withr
          needs: check

      - name: Run R CMD check
        run: |
          Rscript -e "rcmdcheck::rcmdcheck(args = c('--no-manual', '--ignore-vignettes'), build_args = '--no-build-vignettes', error_on = 'warning', check_dir = 'check')"

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: rcmdcheck-${{ matrix.config.os }}-${{ matrix.config.r }}
          path: check
