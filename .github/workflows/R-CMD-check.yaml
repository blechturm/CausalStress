name: R-CMD-check

"on":
  push:
    branches: [main, master, v0.2.0, v0.2.1]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  NOT_CRAN: "true"
  _R_CHECK_FORCE_SUGGESTS_: "false"

permissions:
  contents: read

jobs:
  R-CMD-check:
    name: ${{ matrix.config.os }} / R ${{ matrix.config.r }}
    runs-on: ${{ matrix.config.os }}

    strategy:
      fail-fast: false
      matrix:
        config:
          - { os: ubuntu-latest, r: release }
          - { os: ubuntu-latest, r: devel }
          - { os: windows-latest, r: release }
          - { os: macos-latest, r: release }

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: '"hard"'
          install-pandoc: false
          install-quarto: true
          quarto-version: 1.9.38
          extra-packages: |
            any::rcmdcheck
            any::testthat
            any::pkgload
            any::withr
            any::knitr
            any::rmarkdown
            quarto@1.5.1
            pkgdown@2.2.1
          needs: check

      - name: Verify documentation substrate
        run: Rscript tools/ci-docs.R

      - name: Expose the checked-out package to Windows vignette subprocesses
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $checkLib = Join-Path $env:RUNNER_TEMP "causalstress-check-lib"
          New-Item -ItemType Directory -Force -Path $checkLib | Out-Null
          $rExe = (Get-Command R.exe -ErrorAction Stop).Source
          & $rExe CMD INSTALL --library="$checkLib" .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "R_LIBS=$checkLib;$env:R_LIBS" >> $env:GITHUB_ENV

      - name: Run R CMD check
        run: |
          Rscript -e "rcmdcheck::rcmdcheck(args = '--no-manual', error_on = 'warning', check_dir = 'check')"

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: rcmdcheck-${{ matrix.config.os }}-${{ matrix.config.r }}
          path: check
